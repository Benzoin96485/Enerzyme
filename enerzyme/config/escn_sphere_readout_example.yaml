# Example layer stack: eSCN Core + SphereSampleReadout (paper-style S² integration).
# Predicts any atomic scalar fields listed in output_fields (here Ea and Qa).
# Default production path remains SimpleReadout + energy-conserving Force; this stack
# is opt-in. Direct vector Fa via vector_output_fields is supported but not shown.

build_params:
  dim_embedding: 64
  num_rbf: 32
  max_Za: 94
  cutoff_sr: 6.0
  cutoff_fn: polynomial

layers:
  - name: RangeSeparation
  - name: BesselRBF
    params:
      cutoff_fn: polynomial
      trainable: false
  - name: RandomAtomEmbedding
  - name: Core
    params:
      sphere_channels: 64
      hidden_channels: 128
      edge_channels: 64
      lmax: 2
      mmax: 2
      num_layers: 2
  - name: SphereSampleReadout
    params:
      output_fields: [Ea, Qa]
      head_type: escn_mlp
      num_sphere_samples: 128
      keep_feature: false
  - name: ChargeConservation
  - name: EnergyReduce
  # Prefer energy-conserving Force; omit if using vector_output_fields: [Fa]
  - name: Force
