# SO3LR stack (Kabylda et al., JACS 2025): So3krates Core + universal pairwise FF.
# Use architecture: so3lr under Modelhub.internal_FFs (Enerzymette-compatible).
#
# Core is identical to so3krates; physics (ZBL / erf-Coulomb / TS–QDO) and
# Hirshfeld / partial-charge heads are post-core layers. Do not use Grimme D3/D4
# or SpookyNet ElectrostaticEnergy for SO3LR parity.
#
# Defaults match the pretrained SO3LR hyperparams (r_max=4.5 Å, L≤4, H=128, T=3,
# σ=4.0, γ=1.2). For gas-phase eval set cutoff_lr ≈ 1000; MD often uses 12 Å
# with dispersion damping 2 Å.

Modelhub:
  internal_FFs:
    FF01:
      architecture: so3lr
      active: true
      build_params:
        dim_embedding: 128
        num_rbf: 32
        max_Za: 118
        cutoff_sr: 4.5
        cutoff_fn: phys
        cutoff_lr: 12.0
      layers:
        - name: RangeSeparation
          params:
            cutoff_fn: phys
        - name: BernsteinRBF
          params:
            cutoff_fn: phys
        - name: RandomAtomEmbedding
        - name: ChargeSpinEmbedding
          params:
            attribute: charge
        - name: ChargeSpinEmbedding
          params:
            attribute: spin
        - name: GatherAtomEmbedding
          params:
            scale_by_sqrt_count: true
        - name: Core
          params:
            degrees: [1, 2, 3, 4]
            num_features: 128
            num_heads: 4
            num_layers: 3
            message_normalization: avg_num_neighbors
            avg_num_neighbors: 13.168995780096482
            initialize_ev_to_zeros: true
            layer_normalization_1: true
            layer_normalization_2: true
            residual_mlp_1: true
            residual_mlp_2: false
            cutoff_fn: phys
        - name: SimpleReadout
          params:
            output_fields: [Ea]
            head_type: dense
            keep_feature: true
        - name: PartialChargeReadout
        - name: ChargeConservation
        - name: HirshfeldReadout
        - name: SO3LRZBLRepulsionEnergy
        - name: ErfCoulombEnergy
          params:
            electrostatic_energy_scale: 4.0
            neighborlist_format_lr: sparse
        - name: TSQDODispersionEnergy
          params:
            dispersion_energy_scale: 1.2
            cutoff_lr_damping: 2.0
            neighborlist_format_lr: sparse
        - name: AtomicCharge2Dipole
        - name: EnergyReduce
        - name: Force
