# SO3LR + Euclidean Fast Attention (architecture: so3lr_efa).
# Same universal pairwise FF as so3lr; So3kratesCore with EFA enabled.
# Enerzymette-compatible: architecture: so3lr_efa + resolved config.yaml.

Modelhub:
  internal_FFs:
    FF01:
      architecture: so3lr_efa
      active: true
      build_params:
        dim_embedding: 128
        num_rbf: 32
        max_Za: 118
        cutoff_sr: 4.5
        cutoff_fn: phys
        cutoff_lr: 12.0
        Bohr_in_R: 0.5291772105638411
        Hartree_in_E: 27.211386245988
      layers:
        - name: RangeSeparation
          params:
            cutoff_fn: phys
        - name: BernsteinRBF
          params:
            cutoff_fn: phys
        - name: RandomAtomEmbedding
        - name: ChargeSpinEmbedding
          params:
            attribute: charge
        - name: ChargeSpinEmbedding
          params:
            attribute: spin
        - name: GatherAtomEmbedding
          params:
            scale_by_sqrt_count: true
        - name: Core
          params:
            degrees: [1, 2, 3, 4]
            num_features: 128
            num_heads: 4
            num_layers: 3
            message_normalization: avg_num_neighbors
            avg_num_neighbors: 13.168995780096482
            initialize_ev_to_zeros: true
            layer_normalization_1: true
            layer_normalization_2: true
            residual_mlp_1: true
            residual_mlp_2: false
            cutoff_fn: phys
            era_use_in_iterations: [0, 1]
            era_lebedev_num: 146
            era_max_frequency: 9.42477796076938
            era_max_length: 12.0
            era_qk_num_features: 32
            era_v_num_features: 16
        - name: SimpleReadout
          params:
            output_fields: [Ea, Qa]
            head_type: dense
            keep_feature: true
        - name: AtomicAffine
          params:
            shifts:
              Qa:
                values: 0.0
                learnable: true
            scales:
              Qa:
                values: 1.0
                learnable: false
        - name: ChargeConservation
        - name: HirshfeldReadout
        - name: ZBLRepulsionEnergy
          params:
            switch_off: 1.5
        - name: ElectrostaticEnergy
          params:
            flavor: SO3LR
            electrostatic_energy_scale: 4.0
            neighborlist_format_lr: sparse
        - name: TSQDODispersionEnergy
          params:
            dispersion_energy_scale: 1.2
            cutoff_lr_damping: 2.0
            neighborlist_format_lr: sparse
        - name: AtomicCharge2Dipole
        - name: EnergyReduce
        - name: Force
