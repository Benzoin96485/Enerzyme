# Minimal DPA4 EMFA SO(2) descriptor stack (water-mini defaults).
# DPA4 owns its radial basis; no shared RBF layer is needed.

Modelhub:
  internal_FFs:
    FF01:
      architecture: dpa4
      active: true
      build_params:
        dim_embedding: 32
        max_Za: 94
        cutoff_sr: 6.0
        cutoff_fn: polynomial
      layers:
        - name: RangeSeparation
        - name: RandomAtomEmbedding
        - name: Core
          params:
            channels: 32
            lmax: 2
            mmax: 1
            n_blocks: 2
            mixing_layers: 3
            n_focus: 1
            n_atten_head: 1
            radial_so2_rank: 1
            ffn_so3_grid: true
        - name: SimpleReadout
          params:
            output_fields: [Ea]
            head_type: dense
            keep_feature: false
        - name: EnergyReduce
        - name: Force
