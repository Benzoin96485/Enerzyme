# EquiformerV2 with paper sphere FFN energy head (EquiformerV2FeedForwardReadout).
# Prefer SimpleReadout stacks for production; this config exercises the optional head.
#
# Shallow ensemble: set shallow_ensemble_size > 1 on EquiformerV2FeedForwardReadout
# and insert ShallowEnsembleReduce after EnergyReduce / Force
# (see equiformer_v2_shallow_ensemble_example.yaml).
#
# Use architecture: equiformer_v2 under Modelhub.internal_FFs.

Modelhub:
  internal_FFs:
    FF01:
      architecture: equiformer_v2
      active: true
      build_params:
        dim_embedding: 64
        num_rbf: 32
        max_Za: 94
        cutoff_sr: 5.0
        cutoff_fn: polynomial
      layers:
        - name: RangeSeparation
        - name: GaussianSmearing
        - name: RandomAtomEmbedding
        - name: Core
          params:
            sphere_channels: 64
            attn_hidden_channels: 64
            num_heads: 4
            attn_alpha_channels: 32
            attn_value_channels: 16
            ffn_hidden_channels: 128
            lmax: 2
            mmax: 2
            num_layers: 2
            edge_channels: 64
            norm_type: rms_norm_sh
        - name: EquiformerV2FeedForwardReadout
          params:
            output_fields: [Ea]
            keep_feature: false
        - name: EnergyReduce
        - name: Force
