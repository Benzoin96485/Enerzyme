# Minimal spherical TACE stack.
# Use architecture: tace under Modelhub.internal_FFs.
#
# Papers: arXiv:2509.14961 (TACE), Cartesian-3j arXiv:2512.16882
# Upstream: https://github.com/xvzemin/tace (MIT). TECE not included.

Modelhub:
  internal_FFs:
    FF01:
      architecture: tace
      active: true
      build_params:
        dim_embedding: 48
        num_rbf: 8
        max_Za: 94
        cutoff_sr: 6.0
        cutoff_fn: polynomial
      layers:
        - name: RangeSeparation
        - name: BesselRBF
          params:
            trainable: false
        - name: NuclearEmbedding
        - name: Core
          params:
            tensor_basis: spherical
            num_layers: 2
            num_channel: 48
            Lmax: 2
            lmax: 3
            correlation: 2
            avg_num_neighbors: 8.0
            parity: false
            edge_embedding: nonlinear
            edge_update: element2
            scatter_norm: avg_num_neighbors
            resnet_type: BB
            resnet_linear_type: aware
            use_first_resnet: false
            nonlinear: sigmoid_gate
            radial_mlp: [64, 64, 64]
        - name: SimpleReadout
          params:
            output_fields: [Ea]
            head_type: dense
            keep_feature: false
        - name: EnergyReduce
        - name: Force
