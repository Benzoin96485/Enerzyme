Datahub:
  fields:                                       # new data fields to be registered beyond what are listed below
    Qa_xTB:                                     # new data field name
      is_atomic: true                           # if the data field is an atomic feature. This is the only supported type for now.
  datasets:                                     # Dictionary of datasets
    my_dataset_1:                               # dataset key
      data_path: "/my/dataset.pkl"              # path to dataset: pickle, npz or hdf5
      data_format: pickle                       # pickle, npz or hdf5
                                                # features and targets' key mappings which map standard data field name in enerzyme to the data field name in your dataset
                                                # atomic quantities always end with "a" in standard field names
                                                # if some your name is exactly the same as the standard name, just leave the mapping value empty
      features:
        Ra: coord                               # atomic positions, shape [Nframe, Natom, 3] (required)
        Za: atom_type                           # atomic numbers or symbols (will be automatically converted to numbers), shape [Nframe, Natom] (required)
        Q: null                                 # total charges, shape [Nframe]. If not provided, 0 is assumed for each frame
        N: null                                 # total atom counts, shape [Nframe] 
                                                # if not provided, will be infered from Za
                                                # if provided, other atomic properties can be padded to the same length and truncated to the atom count when reading
        Qa_xTB: xtb_chrg                        # Then you can use the newly registered data field "Qa_xTB" in the datahub as a feature
      targets:
        E: energy                               # total energy, shape [Nframe]
        Fa: grad                                # atomic forces, shape [Nframe, Natom, 3]
        Qa: chrg                                # atomic charges, shape [Nframe, Natom]
        Q: null                                 # total charges, shape [Nframe]. If not provided, 0 is assumed for each frame
        M2: dipole                              # total dipole moment, shape [Nframe, 3]
      preload: false                            # load the processed data from the dump directory
      neighbor_list: full                       # neighbor list building algorithm:
                                                # full: all atom pairs are neighbors
                                                # if left as blank, full neighbor lists will be calculated on-the-fly with the model
      compressed: true                          # compress the integer fields to one datapoint if all-the-same in the dataset
                                                # e.g. for configurations of the same molecule, Za, neighbor_list, N will be compressed
      max_memory: 10                            # maximum memory (in GB) used as cache for reading hdf5 dataset
      transforms:
        atomic_energy: "/my/atomic/energy.csv"  # path to store atomic_energy with columns atom_type and atomic_energy
                                                # summation of atomic reference energies in each frame will be deducted from the total energy
        negative_gradient: true                 # flip the sign of the gradient, use it when the Fa targets are gradients instead of forces
        total_energy_normalization: false       # normalize the total energy globally by substract the mean and divide the standard deviation
        # uniform_qs_init: true                # optional: Q_init_a=Q/N, S_init_a=S/N (flow init).
        #   Prefer Datahub.global_transforms, or per-dataset transforms (→ preprocessings).
        #   Requires Q (and S for spin) in features.
        # xtb_qs_prior:                        # optional: GFN2-xTB + xtbml prior into Q_init_a / S_init_a
        #   enabled: true                      #   (max_scf_iter default 1; requires tblite with xtbml)
        #   max_scf_iter: 1
        # pyscf_nao_qs_prior:                  # optional: GPU4PySCF/PySCF NAO prior; xc and basis required
        #   enabled: true
        #   xc: wb97m-v
        #   basis: def2-svp
        #   max_scf_iter: 1
        #   conv_tol: 1.0e-6
        #   density_fit: true
        #   use_gpu: true
        # qs_delta: true                       # optional: overwrite Qa/Sa with residual vs Q_init_a/S_init_a
        #   # Enable only one of uniform_qs_init / xtb_qs_prior / pyscf_nao_qs_prior with qs_delta
        #   # in the same preprocessings or global_transforms block.
Modelhub:
  internal_FFs:                             # force fields built in enerzyme
    FF01:                                   # force field ID
      suffix:                               # descriptive suffix
      architecture: PhysNet                 # architecture of the core
      active: false                         # if used in current training
      loss:
        mae:                                # mean absolute error, key-value pairs below are targets and weights
          Qa: 1
          Fa: 52.917721
          E: 1
          M2: 1.8897261
          Q: 1
        nh_penalty:                         # special loss term for PhysNet architecture
          weight: 0.01
      Metric:                               # metric defined for this model
        Qa:                                 # metric term
          rmse: 1                           # key-value pair of metric type (rmse/mae) and weight
                                            # weighted summation of metric is the 'judge_score' for earlystopping
        Fa:
          rmse: 52.917721
        E:
          rmse: 1
        M2:
          rmse: 1.8897261
        Q:
          rmse: 1
      build_params:                         # parameters shared by the whole model
        dim_embedding: 128                  # dimension of atom embeddings
        num_rbf: 64                         # number of radial basis functions
        max_Za: 94                          # maximum atomic number
        cutoff_sr: 10.0                     # short range cutoff distance
        cutoff_lr: null                     # long range cutoff distance
        Hartree_in_E: 1                     # numerical value of one Hartree in the dataset
        Bohr_in_R: 0.5291772108             # numerical value of one Bohr in the dataset
        cutoff_fn: polynomial               # flavor of the cutoff function, polynomial / bump / smooth
      layers:
        - name: RangeSeparation             # separate short range distances from long range distances and calculate the cutoff function values
                                            # cutoff_sr, cutoff_fn in build_params
        - name: ExponentialGaussianRBF      # exponential Gaussian radial basis function
          params:                           # num_rbf, cutoff_sr, cutoff_fn in build_params
            no_basis_at_infinity: false     # if a basis "centered at infinity" is contained
            init_alpha: 1                   # initial exponential scaling factor
            exp_weighting: false            # if exponential weighted basis function is used
            learnable_shape: true           # if centers and widths of Gaussians are learnable
            init_width_flavor: PhysNet      # widths initialization flavor, PhysNet or SpookyNet
        - name: RandomAtomEmbedding         # random embedding based on the atomic number
                                            # dim_embedding, max_Za in build_params
        - name: ScalarDenseEmbedding        # a dense embedding (perceptron or linear layer) of a scalar feature
          params:                           # dim_embedding in build_params
            embed_field: Qa_xTB             # the field to be embedded
            activation_fn: swish            # activation function type: swish (as a perceptron) or None (as a linear layer)
            activation_params:
              dim_feature: 1                # dimension of features passing through the activation function, 1 is compatible with any shape of features
              initial_alpha: 1              # initial scaling parameter
              initial_beta: 1               # initial temperature parameter
              learnable: false              # learnable scaling and temperature parameter
            initial_weight: orthogonal    # initial weight initialization flavor, orthogonal, xavier_uniform
            initial_bias: zero            # initial bias initialization flavor, zero
            use_bias: true                # if bias is used
        - name: GatherAtomEmbedding         # gather atom embeddings to a single atom embedding
        - name: Core                        # physNet Core
          params:                           # dim_embedding, num_rbf in build_params
            num_blocks: 5                   # number of interaction blocks and output blocks to accumulate atomic properties
            num_residual_atomic: 2          # number of residual layers in the post residual stack of the interaction block
            num_residual_interaction: 3     # number of residual layers in the interaction layer
            num_residual_output: 1          # number of residual layers in the output block
            activation_fn: shifted_softplus # activation function type: shifted_softplus or swiss
            activation_params:
              dim_feature: 1                
              initial_alpha: 1              
              initial_beta: 1               
              learnable: false              
            dropout_rate: 0.0               # dropout rate of all dropout layers
        - name: AtomicAffine                # scale and shift raw atomic prediction
          params:                           # max_Za in build_params
            shifts:
              Ea:
                values: 0                   # initial shift of atomic energy
                learnable: true             # if shifts of atomic energy is learnable
              Qa:
                values: 0                   # initial shift of atomic charge
                learnable: true         
            scales:
              Ea:
                values: 1                   # initial scale of atomic charge
                learnable: true
              Qa:
                values: 1
                learnable: true
        - name: ChargeConservation          # Scale the atomic charge to make sure the summation of atomic charges is equal to the total charge
        - name: AtomicCharge2Dipole         # Calculate the dipole moment from the atomic charge
        - name: ElectrostaticEnergy         # Calculate the atomic electrostatic energy from the atomic charge
          params:                           # Hartree_in_E, Bohr_in_R, cutoff_lr in build_params
            flavor: PhysNet                 # damping flavor, PhysNet or SpookyNet
        # - name: GrimmeD3Energy
        #   params:
        #     learnable: true
        - name: EnergyReduce                # Reduce atomic energy terms to the total energy
        - name: Force                       # Calculate the force from the total energy
    FF02:
      suffix:
      architecture: SpookyNet
      active: true
      pretrain_path: /pretrained/model      # Path to the folder containing a pretrained pth ("model_best.pth") or to the pth itself
      loss:
        rmse:
          Qa: 1
          Fa: 91.656181
          E: 1
          M2: 3.2731016
      Metric:
        Qa:
          rmse: 1
        Fa:
          rmse: 91.656181
        E:
          rmse: 1
        M2:
          rmse: 3.2731016
      build_params:
        dim_embedding: 64
        num_rbf: 16
        max_Za: 86
        cutoff_sr: 5.291772105638412
        Hartree_in_E: 1
        Bohr_in_R: 0.5291772108
        activation_fn: swish
      layers:
        - name: RangeSeparation
          params:
            cutoff_fn: bump
        - name: ExponentialBernsteinRBF     # exponential Bernstein polynomial radial basis function
          params:
            no_basis_at_infinity: false     # if a basis "centered at infinity" is contained
            init_alpha: 0.9448630629184640  # initial exponential scaling factor
            exp_weighting: false            # if exponential weighted basis function is used
            learnable_shape: true           # if centers and widths of Gaussians are learnable
        - name: NuclearEmbedding            # embedding based on the atomic number and the atomic electron configuration
          params: 
            zero_init: false                # If the embedding is initialized with zeros
            use_electron_config: true       # If the electron configuration is used
        - name: ElectronicEmbedding         # embedding based on the electron attributes
          params:                           # dim_embedding, activation_fn in build_params
            num_residual: 1                 # number of residual layers applied to features encoding the electronic state
            attribute: charge               # electron attribute the embedding stands for, charge or spin
        - name: ElectronicEmbedding
          params:
            num_residual: 1
            attribute: spin
        - name: ScalarResidualMLPEmbedding  # a residual MLP of an atomicscalar feature
          params:                           # dim_embedding in build_params
            embed_field: Qa_xTB             
            activation_fn: swish            # activation function type: swish (as a perceptron) or None (as a linear layer)
            activation_params:
              dim_feature: 1                # dimension of features passing through the activation function, 1 is compatible with any shape of features
              initial_alpha: 1              # initial scaling parameter
              initial_beta: 1               # initial temperature parameter
            learnable: false                # learnable scaling and temperature parameter
            initial_weight1: orthogonal     # initial weight initialization flavor for the first linear layer in each residual block
            initial_weight2: orthogonal     # initial weight initialization flavor for the second linear layer in each residual block
            initial_weight_out: orthogonal  # initial weight initialization flavor for the output linear layer
            initial_bias_residual: zero     # initial bias initialization flavor for residual blocks
            initial_bias_out: zero          # initial bias initialization flavor for the output linear layer
            use_bias_residual: true         # if bias is used in residual blocks
            use_bias_out: true              # if bias is used in the output layer
            use_residual: true              # if residual connections are used
        - name: Core                        # SpookyNet Core
          params:                           # dim_embedding, num_rbf, activation_fn in build_params
            num_modules: 3                  # number of modules (iterations) for constructing atomic features
            num_residual_pre: 1             # number of residual blocks applied to atomic features in each module (before other transformations)
            num_residual_local_x: 1         # number of residual blocks (per module) applied to atomic features in local interaction
            num_residual_local_s: 1         # number of residual blocks (per module) applied to s-type interaction features in local interaction
            num_residual_local_p: 1         # number of residual blocks (per module) applied to p-type interaction features in local interaction
            num_residual_local_d: 1         # number of residual blocks (per module) applied to d-type interaction features in local interaction
            num_residual_local: 1           # number of residual blocks applied to gathered atomic features in local interaction
            num_residual_nonlocal_q: 1      # number of residual blocks (per module) applied to attention query in non-local interaction
            num_residual_nonlocal_k: 1      # number of residual blocks (per module) applied to attention key in non-local interaction
            num_residual_nonlocal_v: 1      # number of residual blocks (per module) applied to attention value in non-local interaction
            num_residual_post: 1            # number of residual blocks applied to atomic features in each module (after other transformations)
            num_residual_output: 1          # number of residual blocks applied to atomic features in output branches (per module)
            use_irreps: true                # If irreducible representions (spherical harmonics) are used for p- and d-type features
            dropout_rate: 0.0               # dropout rate of all dropout layers
        - name: AtomicAffine
          params:
            shifts:
              Ea:
                values: 0
                learnable: true
              Qa:
                values: 0
                learnable: true
            scales:
              Ea:
                values: 1
                learnable: true
              Qa:
                values: 1
                learnable: true
        - name: ChargeConservation
        - name: AtomicCharge2Dipole
        # - name: ZBLRepulsionEnergy
        - name: ElectrostaticEnergy
          params:
            flavor: SpookyNet
        # - name: GrimmeD4Energy
        #   params:
        #     learnable: true
        - name: EnergyReduce
        - name: Force
    FF03:
      suffix:
      architecture: AlphaNet
      active: true
      loss:
        rmse:
          Qa: 1
          Fa: 52.917721
          E: 1
          M2: 1.8897261
      build_params:
        max_Za: 94
        cutoff_sr: 5.0
        cutoff_fn: cosine
        dim_embedding: 128
        num_rbf: 96
        Hartree_in_E: 1
        Bohr_in_R: 0.5291772108
      layers:
        - name: RangeSeparation
        - name: BesselRBF
          params:
            flavor: equflash
            apply_cutoff_fn: false
        - name: RandomAtomEmbedding
        - name: Core
          params:
            num_layers: 4
            head: 16
            main_chi1: 24
            mp_chi1: 24
            chi2: 6
            hidden_channels_chi: 96
            has_dropout_flag: true
            has_norm_before_flag: true
            has_norm_after_flag: false
            reduce_mode: sum
            fte_scalarization: l2
        - name: SimpleReadout
          params:
            output_fields:
              - Ea
              - Qa
            head_type: residual_mlp
            num_residual: 2
            dim_embedding: 128
        - name: AtomicAffine
          params:
            shifts:
              Ea:
                values: 0
                learnable: true
              Qa:
                values: 0
                learnable: true
            scales:
              Ea:
                values: 1
                learnable: true
              Qa:
                values: 1
                learnable: true
        - name: ChargeConservation
        - name: AtomicCharge2Dipole
        - name: ElectrostaticEnergy
          params:
            flavor: PhysNet
            cutoff_lr: null
        - name: EnergyReduce
        - name: Force
    FF04:
      suffix:
      active: true
      architecture: MACE
      build_params:
        Bohr_in_R: 0.5291772108
        Hartree_in_E: 1
        cutoff_sr: 5.0
        dim_embedding: 128
        num_rbf: 8
        max_Za: 86
        cutoff_fn: polynomial
      layers:
        - name: RangeSeparation # cutoff_sr, cutoff_fn in build_params
        - name: BesselRBF # cutoff_sr, cutoff_fn in build_params
          params: 
            trainable: false
        - name: NuclearEmbedding
          params: # max_Za, dim_embedding in build_params
            zero_init: false
            use_electron_config: true
        - name: ElectronicEmbedding
          params: # dim_embedding, activation_fn in build_params
            num_residual: 1
            attribute: charge
        - name: ElectronicEmbedding
          params:
            num_residual: 1
            attribute: spin
        - name: Core # max_Za, num_rbf, dim_embedding in build_params
          params: 
            max_ell: 3
            additional_hidden_irreps: 128x1o
            interaction_cls_first: RealAgnosticResidualInteractionBlock
            interaction_cls: RealAgnosticResidualInteractionBlock
            correlation: 3
            num_interactions: 2
            avg_num_neighbors: 8.0
            MLP_irreps: 16x0e
            radial_MLP: [64, 64, 64]
            gate: silu
        - name: AtomicAffine
          params:
            scales:
              Ea:
                learnable: true
                values: 1
              Qa:
                learnable: true
                values: 1
            shifts:
              Ea:
                learnable: true
                values: 0
              Qa:
                learnable: true
                values: 0
        - name: ChargeConservation
        - name: ElectrostaticEnergy # Hartree_in_E, Bohr_in_R in build_params; cutoff_lr as default
          params:
            flavor: PhysNet
        - name: AtomicCharge2Dipole
        - name: EnergyReduce                # Reduce atomic energy terms to the total energy
        - name: Force                       # Calculate the force from the total energy
      loss:
        mae:
          Fa: 52.917721
          M2: 1.8897261
          Q: 1
          Qa: 1
          E: 1
    FF07:
      suffix:
      architecture: SchNet
      active: true
      loss:
        rmse:
          Fa: 52.917721
          Qa: 1
          E: 1
          M2: 1.8897261
          Q: 1
      build_params:                        
        dim_embedding: 128
        num_rbf: 128
        max_Za: 94
        cutoff_sr: 5.0
        Hartree_in_E: 1
        Bohr_in_R: 0.5291772108
      layers:
        - name: RangeSeparation             
        - name: GaussianRBF                 # Gaussian RBF (SchNet width; no envelope on RBF)
          params:                           # num_rbf, cutoff_sr in build_params
            flavor: SchNet
            apply_cutoff_fn: false
        - name: RandomAtomEmbedding        
        - name: Core                        # SchNet Core
          params:                           # dim_embedding, num_rbf in build_params
            num_interactions: 4             # number of interaction blocks
            hidden_channels: 128            # dimension of hidden channels
            activation_fn: shifted_softplus
            activation_params:
              dim_feature: 1
              initial_alpha: 1
              initial_beta: 1
              learnable: false
        - name: AtomicAffine
          params:
            shifts:
              Ea:
                values: 0
                learnable: true
              Qa:
                values: 0
                learnable: true         
            scales:
              Ea:
                values: 1
                learnable: true
              Qa:
                values: 1
                learnable: true
        - name: ChargeConservation
        - name: AtomicCharge2Dipole
        - name: ElectrostaticEnergy
          params:
            flavor: PhysNet
        - name: EnergyReduce
        - name: Force
    FF08:
      suffix:
      # Experimental: Enerzyme-adapted (魔改) AllScAIP — not a recommended production model yet.
      architecture: AllScAIP
      active: false
      loss:
        mae:
          Fa: 52.917721
          M2: 1.8897261
          Q: 1
          Qa: 1
          E: 1
      build_params:
        # --- Global (fairchem GlobalConfigs) ---
        dim_embedding: 128
        num_layers: 4
        activation: silu
        use_node_path: true
        use_residual_scaling: true
        Hartree_in_E: 1
        Bohr_in_R: 0.5291772108
        # --- Shared RBF / species (Enerzyme pre-core; num_rbf, cutoff_* for BesselRBF) ---
        num_rbf: 8
        max_Za: 86
        cutoff_sr: 5.0
        cutoff_fn: polynomial
        # --- Molecular graph (fairchem MolecularGraphConfigs) ---
        knn_k: 32
        knn_pad_size: null
        knn_soft: false
        knn_sigmoid_scale: 0.2
        knn_lse_scale: 0.1
        knn_use_low_mem: false
        use_envelope: true
        distance_function: gaussian
        edge_distance_expansion_size: 8
        edge_direction_expansion_size: 3
        node_direction_expansion_size: 3
        preprocess_on_cpu: false
        pbc: false
        use_padding: false
        max_atoms: null
        max_batch_size: null
        single_system_no_padding: false
        # --- GNN / attention (fairchem GraphNeuralNetworksConfigs) ---
        atten_num_heads: 4
        ffn_hidden_layer_multiplier: 2
        attn_num_freq: 32
        freequency_list: null
        use_freq_mask: true
        use_sincx_mask: true
        # --- Equivariant LAE (e3nn TP + irrep norms; forces use_freq_mask off in the core) ---
        equivariant_mode: false
        equivariant_tp_hidden: 32
        equivariant_tp_mul: 8
        # --- Regularization (fairchem RegularizationConfigs) ---
        normalization: layer_norm
        mlp_dropout: 0.0
        atten_dropout: 0.0
      layers:
        - name: RangeSeparation
        - name: BesselRBF
          params:
            trainable: false
        - name: NuclearEmbedding
          params:
            zero_init: false
            use_electron_config: true
        - name: ElectronicEmbedding
          params:
            num_residual: 1
            attribute: charge
        - name: ElectronicEmbedding
          params:
            num_residual: 1
            attribute: spin
        - name: Core
          params: {}
        # Core only emits atom_feature; Ea/Qa come from SimpleReadout (see DEFAULT_LAYER_PARAMS).
        - name: SimpleReadout
          params:
            output_fields:
              - Ea
              - Qa
            head_type: residual_mlp
            num_residual: 2
            dim_embedding: 128
        - name: AtomicAffine
          params:
            shifts:
              Ea:
                values: 0
                learnable: true
              Qa:
                values: 0
                learnable: true
            scales:
              Ea:
                values: 1
                learnable: true
              Qa:
                values: 1
                learnable: true
        - name: ChargeConservation
        - name: ElectrostaticEnergy
          params:
            flavor: PhysNet
            cutoff_lr: null
        - name: AtomicCharge2Dipole
        - name: EnergyReduce
        - name: Force
    FF05:
      suffix:
      # Native NequIP. The nequip package is not required.
      # Canonical stack: enerzyme/config/nequip_layers_example.yaml
      architecture: NequIP
      active: true
      loss:
        rmse:
          Fa: 52.917721
          E: 1
      Metric:
        Fa:
          rmse: 52.917721
        E:
          rmse: 1
      build_params:
        dim_embedding: 32
        num_rbf: 8
        max_Za: 94
        cutoff_sr: 5.0
      layers:
        - name: RangeSeparation
        - name: BesselRBF
          params:
            flavor: nequip
            trainable: false
            polynomial_p: 6
        - name: RandomAtomEmbedding
        - name: Core
          params:
            num_layers: 4
            l_max: 1
            parity: true
            num_features: 32
            radial_mlp_depth: 1
            radial_mlp_width: 128
            use_sc: true
            sc_first: false
            avg_num_neighbors: 8
        - name: SimpleReadout
          params:
            output_fields:
              - Ea
            head_type: dense
            use_bias: false
        - name: AtomicAffine
          params:
            shifts:
              Ea:
                values: 0
                learnable: true
            scales:
              Ea:
                values: 1
                learnable: true
        - name: EnergyReduce
        - name: Force
  external_FFs:
    FF06:
      suffix:
      architecture: XPaiNN
      active: true
      loss:
        rmse:
          Fa: 52.917721
          E: 1
      Metric:
        Fa:
          rmse: 52.917721
        E:
          rmse: 1
      build_params:                                  # TODO: explain parameters
        cutoff_sr: 5.0
      layers:
        - name: RangeSeparation
        - name: Core
          params:
            embed_basis: "gfn2-xtb"
            aux_basis: "aux56"
            node_dim: 128
            edge_irreps: "128x0e + 64x1o + 32x2e"
            hidden_dim: 64
            hidden_irreps: "64x0e + 32x1o + 16x2e"
            rbf_kernel: "bessel"
            num_basis: 20
            cutoff_fn: "cosine"
            max_edges: 100
            action_blocks: 3
            activation: silu
            norm_type: "nonorm"
            output_mode: "grad"
            output_dim: 1
            node_average: false
            default_dtype: "float32"
    FF09:
      suffix:
      architecture: Equiformer
      active: false
      loss:
        rmse:
          Qa: 1
          Fa: 52.917721
          E: 1
          M2: 1.8897261
      Metric:
        Qa:
          rmse: 1
        Fa:
          rmse: 52.917721
        E:
          rmse: 1
        M2:
          rmse: 1.8897261
      build_params:
        dim_embedding: 64
        num_rbf: 16
        max_Za: 86
        cutoff_sr: 5.0
        Hartree_in_E: 1
        Bohr_in_R: 0.5291772108
        irreps_node_embedding: "32x0e+16x1e+8x2e"
      layers:
        - name: RangeSeparation
          params:
            cutoff_fn: polynomial
        - name: ExpNormalSmearing
          params:
            trainable: false
        - name: EquiformerNodeEmbedding
          params:
            irreps_node_embedding: "32x0e+16x1e+8x2e"
        - name: Core
          params:
            irreps_node_embedding: "32x0e+16x1e+8x2e"
