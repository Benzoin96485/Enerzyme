          Fa: 52.917721
          E: 1
      Metric:
        Fa:
          mae: 52.917721
        E:
          mae: 1
      build_params:
        dim_embedding: 64
        num_rbf: 3
        max_l: 3
        max_Za: 94
        cutoff_sr: 5.0
        threebody_cutoff: 4.0
      layers:
        - name: RangeSeparation
        - name: SphericalBesselRBF
        - name: GaussianRBF
          params:
            num_rbf: 16
            flavor: SchNet
            apply_cutoff_fn: false
        - name: RandomAtomEmbedding
        - name: Core
          params:
            num_blocks: 3
            num_attn_layers: 2
            num_heads: 4
            graphormer_num_basis: 16
            attention_cutoff: 5.0
            use_centrality: true
        - name: SimpleReadout
          params:
            output_fields: [Ea]
            head_type: gated
            num_hidden_layers: 2
            activate_last: false
        - name: EnergyReduce
        - name: Force
    FF29:
      suffix:
      # TensorNet (Simeon and De Fabritiis, NeurIPS 2023). Cartesian 3x3
      # tensors. ExpNormalSmearing and the species embedding stay outside
      # the Core. The energy head is the shared two-layer SiLU readout.
      # rMD17 widths: 2 layers, 128 channels, 32 basis functions, 4.5 Å.
      # Checkpoints from torchmd-net do not load.
      architecture: tensornet
      active: false
      loss:
        mae:
          Fa: 1
          E: 1
      Metric:
        Fa:
          mae: 1
        E:
          mae: 1
      build_params:
        dim_embedding: 128
        num_rbf: 32
        max_Za: 94
        cutoff_sr: 4.5
        cutoff_fn: cosine
      layers:
        - name: RangeSeparation
        - name: ExpNormalSmearing
          params:
            trainable: false
        - name: RandomAtomEmbedding
        - name: Core
          params:
            num_interactions: 2
            equivariance_group: O(3)
            charge_scale: 0.1
            include_self: true
        - name: SimpleReadout
          params:
            output_fields: [Ea]
            head_type: two_layer
            pyramidal: true
            activation_fn: swish
            activation_params:
              dim_feature: 1
              initial_alpha: 1
              initial_beta: 1
              learnable: false
            keep_feature: false
        - name: EnergyReduce
        - name: Force
    FF30:
      suffix:
      # CHGNet (Deng et al., Nat. Mach. Intell. 2023). Two gemnet Bessel
      # bases (5 Å atom graph, 3 Å bond graph) and the species embedding
      # stay outside the Core. Ma is the nonnegative magnetic-moment
      # magnitude from the latent before the last atom convolution.
      # Add Ma to the loss when those labels exist (paper weight 0.1).
      # Energies are eV and distances are Å. Checkpoints do not load.
      architecture: chgnet
      active: false
      loss:
        mae:
          Fa: 1
          E: 1
      Metric:
        Fa:
          mae: 1
        E:
          mae: 1
      build_params:
        dim_embedding: 64
        num_rbf: 9
        num_angular: 9
        max_Za: 94
        cutoff_sr: 5.0
        bond_cutoff: 3.0
        envelope_exponent: 5
        Hartree_in_E: 27.211386245988
        Bohr_in_R: 0.5291772105638411
      layers:
        - name: RangeSeparation
        - name: BesselRBF
          params:
            flavor: gemnet
            trainable: true
        - name: BesselRBF
          params:
            flavor: gemnet
            trainable: true
            cutoff_sr: 3.0
        - name: RandomAtomEmbedding
        - name: Core
          params:
            num_blocks: 4
        - name: AbsoluteLinearReadout
          params:
            output_fields: [Ma]
        - name: SimpleReadout
          params:
            output_fields: [Ea]
            head_type: mlp
            num_hidden_layers: 2
            activation_fn: swish
            use_bias_out: true
        - name: EnergyReduce
        - name: Force
    FF31:
      suffix:
      # TensorNet2 (Farr et al., arXiv:2601.00581). Same Cartesian core as
      # TensorNet, with neutral charge equilibration inside each message.
      # ExpNormalSmearing, the species embedding, SimpleReadout, and
      # WeightedCoulombEnergy stay outside the Core. layer_weights 1, 2, 3
      # give the last charge block the largest Coulomb share. Their length must
      # divide (num_interactions + 1) * q_dim; build() rejects a mismatch.
      # AceFF does not publish those numbers. Q is the molecular total charge;
      # omit it for a neutral molecule. A length-N Q must repeat that total
      # inside each molecule. AceFF-2-OMOL also adds StandardZBLRepulsionEnergy
      # (fixed ZBL, not the learnable Geodite screen). Set Hartree_in_E to
      # 27.211386245988 on that layer and on WeightedCoulombEnergy when the
      # dataset energy is eV. Checkpoints from torchmd-net do not load.
      architecture: tensornet2
      active: false
      loss:
        mae:
          Fa: 1
          E: 1
      Metric:
        Fa:
          mae: 1
        E:
          mae: 1
      build_params:
        dim_embedding: 128
        num_rbf: 32
        max_Za: 94
        cutoff_sr: 4.5
        cutoff_fn: cosine
        q_dim: 16
      layers:
        - name: RangeSeparation
        - name: ExpNormalSmearing
          params:
            trainable: false
        - name: RandomAtomEmbedding
        - name: Core
          params:
            num_interactions: 2
            equivariance_group: O(3)
            include_self: true
        - name: SimpleReadout
          params:
            output_fields: [Ea]
            head_type: two_layer
            pyramidal: true
            activation_fn: swish
            activation_params:
              dim_feature: 1
              initial_alpha: 1
              initial_beta: 1
              learnable: false
            keep_feature: false
        - name: WeightedCoulombEnergy
          params:
            layer_weights: [1, 2, 3]
            damping_cutoff: 4.6
            pairs: all_to_all
        - name: EnergyReduce
        - name: Force
    FF32:
      suffix:
      # NewtonNet (Haghighatlari et al., Digital Discovery 2022). Symmetric
      # messages, a latent force, and a displacement live in the Core.
      # BesselRBF (default flavor) and RandomAtomEmbedding stay outside.
      # The Core multiplies the polynomial envelope. Default order is 9
      # (both THGLab versions); the paper writes 7. The energy head is the
      # v1 network F -> 128 -> 64 -> 1. variant: repo is InteractionNet on
      # THGLab/NewtonNet main and uses F -> F -> F -> 1. layer_norm
      # normalizes invariant features only. Optional direction loss:
      # latent_force_cosine weight λ_D, compared with Fa. It is removed
      # when another architecture is loaded. Paper MD17 weights are
      # λ_E = 1, λ_F = 50, λ_D = 1.
      # Checkpoints from THGLab/NewtonNet do not load.
      architecture: newtonnet
      active: false
      loss:
        mae:
          Fa: 1
          E: 1
      Metric:
        Fa:
          mae: 1
        E:
          mae: 1
      build_params:
        dim_embedding: 128
        num_rbf: 20
        max_Za: 94
        cutoff_sr: 5.0
      layers:
        - name: RangeSeparation
        - name: BesselRBF
          params:
            flavor: default
            trainable: false
            apply_cutoff_fn: false
        - name: RandomAtomEmbedding
        - name: Core
          params:
            num_interactions: 3
            variant: paper
            envelope_p: 9
            layer_norm: false
            shared_interactions: false
        - name: SimpleReadout
          params:
            output_fields: [Ea]
            head_type: mlp
            hidden_dims: [128, 64]
            activation_fn: swish
            activation_params:
              dim_feature: 1
              initial_alpha: 1
              initial_beta: 1
              learnable: false
            keep_feature: false
        - name: EnergyReduce
        - name: Force
    FF33:
      suffix:
      # EQNorm (Chen, Fu, Yang, Chen). Dual-branch tensor state and scalar
      # accumulator. One-hot species and the equflash Bessel basis stay
      # outside the Core. cutoff_fn nequip is the polynomial window, fixed at
      # p = 6. Core polynomial_p is the second window used when
      # message_envelope is true, so it stays 6 for that stack.
      # See enerzyme/config/eqnorm_layers_example.yaml. Published widths are
      # enerzyme.models.eqnorm.PUBLISHED_MPTRJ_CORE_PARAMS (constant norm),
      # PUBLISHED_MAX_CORE_PARAMS (message_envelope), and
      # PUBLISHED_OMAT_CORE_PARAMS (degree norm). Checkpoints from
      # yzchen08/eqnorm do not load.
      architecture: eqnorm
      active: false
      loss:
        mae:
          Fa: 1
          E: 1
      Metric:
        Fa:
          mae: 1
        E:
          mae: 1
      build_params:
        dim_embedding: 4
        num_rbf: 8
        max_Za: 8
        cutoff_sr: 6.0
        cutoff_fn: nequip
        atomic_numbers: [1, 6, 7, 8]
      layers:
        - name: RangeSeparation
        - name: BesselRBF
          params:
            flavor: equflash
            trainable: true
            apply_cutoff_fn: true
        - name: OneHotAtomEmbedding
        - name: Core
          params:
            num_layers: 2
            lmax: 1
            hidden_irreps: "8x0e+4x1o"
            num_features: 8
            invariant_layers: 2
            invariant_neurons: 16
            avg_num_neighbors: 61.84
            normalization: constant
            message_envelope: false
            polynomial_p: 6
        - name: SimpleReadout
          params:
            output_fields: [Ea]
            head_type: variance_preserving
            use_bias: false
            nonlinearity: silu
        - name: AtomicAffine
          params:
            order: scale_then_shift
            scales:
              Ea:
                values: 1.0
                learnable: false
            shifts:
              Ea:
                values: 0.0
                learnable: true
        - name: EnergyReduce
        - name: Force
    FF34:
      suffix:
      # GemNet-OC (Gasteiger et al., TMLR 2022). Hierarchy of capped graphs
      # on the GemNet stack. Gaussian flavor gemnet-oc owns the envelope.
      # The Core does not own the embedding or the energy head. Direct
      # forces and the OC20 tag filter are not implemented. fairchem
      # checkpoints do not load. See enerzyme/config/gemnet_oc_layers_example.yaml.
      architecture: gemnet-oc
      active: false
      loss:
        mae:
          Fa: 52.917721
          E: 1
      Metric:
        Fa:
          mae: 52.917721
        E:
          mae: 1
      build_params:
        dim_embedding: 256
        num_rbf: 128
        max_Za: 94
        cutoff_sr: 12.0
      layers:
        - name: RangeSeparation
        - name: GaussianRBF
          params:
            flavor: gemnet-oc
            apply_cutoff_fn: false
            envelope_exponent: 5
        - name: RandomAtomEmbedding
        - name: Core
        - name: HierachicalReadout
          params:
            output_fields: [Ea]
            head_type: dense
            use_bias: false
            initial_weight: orthogonal
        - name: EnergyReduce
        - name: Force
    FF35:
      suffix:
      # Equivariant Transformer (Thölke and De Fabritiis, ICLR 2022).
      # ExpNormalSmearing and the first species embedding stay outside the
      # Core. The neighbor embedding keeps a second species table. The energy
      # head is the shared two-layer SiLU readout. vector_cutoff true matches
      # the current ET-MD17 example; false is the 2022 paper. MD17 widths:
      # 6 layers, 8 heads, 128 channels, 32 basis functions, 5 Å.
      # Checkpoints from torchmd-net do not load.
      architecture: et
      active: false
      loss:
        mae:
          Fa: 1
          E: 1
      Metric:
        Fa:
          mae: 1
        E:
          mae: 1
      build_params:
        dim_embedding: 128
        num_rbf: 32
        max_Za: 94
        cutoff_sr: 5.0
        cutoff_fn: cosine
      layers:
        - name: RangeSeparation
        - name: ExpNormalSmearing
          params:
            trainable: false
        - name: RandomAtomEmbedding
        - name: Core
          params:
            num_layers: 6
            num_heads: 8
            distance_influence: both
            neighbor_embedding: true
            vector_cutoff: true
            include_self: true
        - name: SimpleReadout
          params:
            output_fields: [Ea]
            head_type: two_layer
            pyramidal: true
            activation_fn: swish
            activation_params:
              dim_feature: 1
              initial_alpha: 1
              initial_beta: 1
              learnable: false
            keep_feature: false
        - name: EnergyReduce
        - name: Force
    FF36:
      suffix:
      # BOTNet (Batatia et al., design space of E(3)-equivariant atom-centred
      # potentials). The Core reuses the MACE interaction blocks and does not
      # apply the symmetric product. Bessel flavor mace with polynomial_p 6 is
      # the BOTNet envelope. Messages are summed onto idx_j. Published CLI
      # widths are PUBLISHED_CORE_PARAMS. gncs/botnet checkpoints do not load.
      architecture: botnet
      active: false
      loss:
        mae:
          Fa: 1
          E: 1
      Metric:
        Fa:
          mae: 1
        E:
          mae: 1
      build_params:
        dim_embedding: 16
        num_rbf: 8
        max_Za: 94
        cutoff_sr: 4.0
        avg_num_neighbors: 1.0
      layers:
        - name: RangeSeparation
        - name: BesselRBF
          params:
            flavor: mace
            trainable: false
            polynomial_p: 6
        - name: RandomAtomEmbedding
        - name: Core
          params:
            max_ell: 2
            num_interactions: 2
            variant: agnostic
            output_mode: layers
            MLP_irreps: 16x0e
            radial_MLP: [64, 64, 64]
            gate: silu
        - name: BOTNetEnergyReadout
          params:
            MLP_irreps: 16x0e
            gate: silu
        - name: AtomicAffine
          params:
            shifts:
              Ea:
                values: 0
                learnable: true
            scales:
              Ea:
                values: 1
                learnable: true
        - name: EnergyReduce
        - name: Force
    FF37:
      suffix:
      # REANN (Zhang, Xia, and Jiang, J. Chem. Phys. 2022). The Core is the
      # recursive embedded-atom density. RandomAtomEmbedding is the initial
      # orbital coefficient. num_iterations 0 is EANN. MD17 widths are
      # PUBLISHED_MD17_CORE_PARAMS. zhangylch/REANN checkpoints do not load.
      architecture: reann
      active: false
      loss:
        mae:
          Fa: 1
          E: 1
      Metric:
        Fa:
          mae: 1
        E:
          mae: 1
      build_params:
        dim_embedding: 32
        max_Za: 94
        cutoff_sr: 5.0
      layers:
        - name: RangeSeparation
        - name: RandomAtomEmbedding
        - name: Core
          params:
            lmax: 2
            nwave: 8
            num_iterations: 1
            nblock: 1
            hidden_dims: [128, 128]
            activation: relu_like
            layer_norm: true
            elemental: false
        - name: SimpleReadout
          params:
            output_fields: [Ea]
            head_type: mlp
            hidden_dims: [128, 128]
            activation_fn: relu_like
            activation_params:
              dim_feature: 1
              initial_alpha: 1
              initial_beta: 1
              learnable: false
        - name: EnergyReduce
        - name: Force
    FF38:
      suffix:
      # EquiREANN (Wu, Xia, Zhang, and Jiang, J. Phys. Chem. A 2024). The Core
      # extends REANN with the equivariant orbital message. RandomAtomEmbedding
      # is the initial orbital coefficient. num_iterations 0 is the embedded-atom
      # density. Cumulene widths are PUBLISHED_CUMULENE_CORE_PARAMS.
      # bjiangch/EquiREANN checkpoints do not load.
      architecture: equireann
      active: false
      loss:
        mae:
          Fa: 1
          E: 1
      Metric:
        Fa:
          mae: 1
        E:
          mae: 1
      build_params:
        dim_embedding: 32
        max_Za: 94
        cutoff_sr: 6.0
      layers:
        - name: RangeSeparation
        - name: RandomAtomEmbedding
        - name: Core
          params:
            lmax: 2
            nwave: 20
            num_iterations: 2
            nblock: 1
            hidden_dims: [32, 32]
            activation: tanh_like
            layer_norm: false
            elemental: false
        - name: SimpleReadout
          params:
            output_fields: [Ea]
            head_type: mlp
            hidden_dims: [32, 32]
            activation_fn: relu_like
            activation_params:
              dim_feature: 1
              initial_alpha: 1
              initial_beta: 1
              learnable: false
        - name: EnergyReduce
        - name: Force
    FF39:
      suffix:
      # ViSNet (Wang et al., Nat. Commun. 2024). The Core extends the
      # Equivariant Transformer with an edge state and runtime vector
      # rejection. ExpNormalSmearing and the first species embedding stay
      # outside. lmax 2 still exposes a Cartesian l = 1 vector, plus
      # atom_l2_feature. vertex_type none is the published MD17/QM9 setting.
      # MD17 widths: 9 layers, 8 heads, 256 channels, 32 basis functions, 5 Å.
      # QM9 is PUBLISHED_QM9_CORE_PARAMS. AI2BMD checkpoints do not load.
      # The reference neighbor cap of 32 is not applied.
      architecture: visnet
      active: false
      loss:
        mae:
          Fa: 1
          E: 1
      Metric:
        Fa:
          mae: 1
        E:
          mae: 1
      build_params:
        dim_embedding: 256
        num_rbf: 32
        max_Za: 100
        cutoff_sr: 5.0
        cutoff_fn: cosine
      layers:
        - name: RangeSeparation
        - name: ExpNormalSmearing
          params:
            trainable: false
        - name: RandomAtomEmbedding
        - name: Core
          params:
            num_layers: 9
            num_heads: 8
            lmax: 2
            vertex_type: none
            vecnorm_type: none
            trainable_vecnorm: false
            neighbor_embedding: true
            include_self: true
        - name: SimpleReadout
          params:
            output_fields: [Ea]
            head_type: two_layer
            pyramidal: true
            activation_fn: swish
            activation_params:
              dim_feature: 1
              initial_alpha: 1
              initial_beta: 1
              learnable: false
            keep_feature: false
        - name: EnergyReduce
        - name: Force
    FF40:
      suffix:
      # ViSNet-LSRM (Li et al., ICLR 2024). The Core is ViSNet plus a serial
      # atom–fragment long-range block. The latent is the concatenation, so
      # SimpleReadout sees 2F channels. fragment_mode kmeans is the online
      # fallback. MD22 used BRICS: fragment_mode precomputed and Datahub
      # field cluster_ids. The paper loss weight is E: 1, Fa: 80. The
      # released script also set dropout 0.1; this stack keeps dropout 0.
      # liyy2/LSR-MP checkpoints do not load.
      architecture: visnet_lsrm
      active: false
      loss:
        mae:
          Fa: 1
          E: 1
      Metric:
        Fa:
          mae: 1
        E:
          mae: 1
      build_params:
        dim_embedding: 128
        num_rbf: 50
        max_Za: 100
        cutoff_sr: 4.0
        cutoff_lr: 9.0
        cutoff_fn: cosine
      layers:
        - name: RangeSeparation
        - name: ExpNormalSmearing
          params:
            trainable: true
        - name: RandomAtomEmbedding
        - name: Core
          params:
            num_layers: 6
            long_layers: 2
            num_heads: 8
            lmax: 1
            vertex_type: none
            vecnorm_type: max_min
            trainable_vecnorm: false
            neighbor_embedding: true
            include_self: false
            cutoff_lr: 9.0
            fragment_mode: kmeans
            center: atomic_number
            min_nodes_per_group: 24
            dropout: 0.0
            trainable_rbf_lr: true
        - name: SimpleReadout
          params:
            output_fields: [Ea]
            head_type: two_layer
            pyramidal: true
            activation_fn: swish
            activation_params:
              dim_feature: 1
              initial_alpha: 1
              initial_beta: 1
              learnable: false
            keep_feature: false
        - name: EnergyReduce
        - name: Force
    FF41:
      suffix:
      # QuinNet (Wang et al., NeurIPS 2023). The Core is the equivariant
      # transformer plus six body-order channels through l = 2. The energy
      # head is the shared two-layer SiLU readout. Widths are the aspirin
      # example: 5 layers, 8 heads, 256 channels, 32 basis functions, 5 Å.
      # Zun-Wang/QuinNet checkpoints do not load.
      architecture: quinnet
      active: false
      loss:
        mae:
          Fa: 1
          E: 1
      Metric:
        Fa:
          mae: 1
        E:
          mae: 1
      build_params:
        dim_embedding: 256
        num_rbf: 32
        max_Za: 100
        cutoff_sr: 5.0
        cutoff_fn: cosine
      layers:
        - name: RangeSeparation
        - name: ExpNormalSmearing
          params:
            trainable: false
        - name: RandomAtomEmbedding
        - name: Core
          params:
            num_layers: 5
            num_heads: 8
            distance_influence: both
            neighbor_embedding: true
            include_self: true
        - name: SimpleReadout
          params:
            output_fields: [Ea]
            head_type: two_layer
            pyramidal: true
            activation_fn: swish
            activation_params:
              dim_feature: 1
              initial_alpha: 1
              initial_beta: 1
              learnable: false
            keep_feature: false
        - name: EnergyReduce
        - name: Force
Trainer:
  Splitter:
    method: random                          # splitting method: random
    parts:                                  # partitions, at least training and validation are needed
      - name: training                      # each partition has a name and sources
        sources:
          - dataset: my_dataset_1           # using multiple datasets with its datahub key as sources
            ratio: 0.7                      # with different ratios, the sum of ratios should be 1
      - name: validation
        sources:
          - dataset: my_dataset_1
            ratio: 0.1
      - name: test
        sources:
          - dataset: my_dataset_1
            ratio: 0.2
    preload: true                           # if saved splitting indices are loaded
    save: true                              # if splitting indices are saved
    seed: 114514                            # splitting random seed
  Monitor:                                  # monitor prints statistics of energy terms in the total energy on validation set
                                            # optional
    E_ele:                                  # energy term name: 
                                              # E_ele for ElectrostaticEnergy layer
                                              # E_disp for GrimmeD3Energy or GrimmeD4Energy layer
                                              # E_zbl for ZBLRepulsionEnergy layer
                                            # four statistics are supported:
      - mean                                # mean value
      - std                                 # standard deviation
      - min                                 # minimum value
      - max                                 # maximum value
  seed: 114514                              # trainer random seed: dataloader shuffling, pytorch random initialization, etc.
  learning_rate: 0.001                      # learning rate, default 0.001
  schedule: constant                        # learning rate scheduler: default linear
                                            # (linear | cosine | cosine_with_restarts | polynomial | constant | constant_with_warmup | inverse_sqrt)
  warmup_ratio: 0.001                       # ratio of warmup epochs in total epochs, if applicable for the schedule
  patience: 200                             # patience of earlystopping, default 50
                                            # training stops when the number of epochs that 'judge score' doesn't decreases reach the patience
  max_norm: -1                              # gradient clipping threshold of the norm, default -1 (negative value means no clipping)
  cuda: true                                # if cuda is searched and used if possible
  weight_decay: 0                           # weight decay rate of the Adam optimizer, default 0
  batch_size: 8                             # batch size of the dataloader, default 8
  inference_batch_size: 4                   # batch size of the dataloader for inference, default the same as batch_size
  max_epochs: 10000                         # maximum epochs of training if earlystopping isn't triggered, default 1000
  dtype: float32                            # pytorch data type throughout the computation: float32 (single) / float64 (double), default float32
  use_ema: true                             # if exponential moving average is used, default true
  ema_decay: 0.999                          # decay rate of exponential moving average, default 0.999
  ema_use_num_updates: true                 # if number of updates is used in exponential moving average, default true
  data_in_memory: false                     # if whole training datasets are loaded into memory, default false
  amsgrad: true                             # if amsgrad is used in Adam optimizer, default true
  resume: 0                                 # 0: start from scratch. If pretrained model is given, load its ema averaged weights, best-first unless specified
                                            # 1: try to load model checkpoint (and ema state if available), last-first unless specified, resume epoch counting
                                            # 2: try to load model checkpoint (and ema state if available), last-first unless specified, resume scheduler, optimizer, epoch counting and earlystopping
  num_workers: -1                           # number of workers for dataloader, default -1 (automatically adjusted)
  lightning: false                          # if true, use pytorch-lightning for training, which automatically handles multi-GPU training.
Metric:                                     # metrics can be defined here as default metrics
                                            # if a metric configuration is defined under a specific model, it has precedence
  Qa:                                       # metric term
    rmse: 1                                 # key-value pair of metric type (rmse/mae) and weight
                                            # weighted summation of metric is the 'judge_score' for earlystopping
  Fa:
