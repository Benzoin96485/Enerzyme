# GPU4PySCF direct-SCF template for annotate (engine: gpu4pyscf).
# Geometry, charge, and multiplicity are injected per structure.
# Set QMDriver.electrolites: true to patch this process with Electrolites.
# Stock and patched runs must be separate processes.
xc: wb97m-v
basis: def2-tzvpd
cart: false
grids_level: 3
nlcgrids_level: 3
conv_tol: 1.0e-10
direct_scf_tol: 1.0e-13
max_cycle: 128
level_shift: 0.0
init_guess: minao
gradients: true
verbose: 0
density_fit: false
pcm: null
electrolites: false
precision_env:
  FASTNLC_MODE: plain
  FASTNLC_BUDGET: "0"
  FASTNLC_RCP: "0"
  FASTNLC_RCUT: inf
