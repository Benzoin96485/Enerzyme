# Enerzymette AL expects fragments.pkl with legacy field names.
# Repo-relative paths: run from the Enerzyme repository root.
Supplier:
  path: null
QMDriver:
  engine: TeraChem
  template_input_file: example/L3-COMT-aselmdb-smoke/fixtures/terachem_template.in
  pickle_name: fragments.pkl
  pickle_fields:
    E: energy
    Fa: grad
    M2: dipole
    Ra: coord
    Za: atom_type
    Q: total_chrg
    S: total_spin
  keep_molden: false
  keep_stdout: false
  clean_tmp: true
  n_processes: 1
  n_gpus: 1
  terachem_args: [terachem]
