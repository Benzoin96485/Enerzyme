# Default: ASE LMDB (Enerzyme-native / future Enerzymette).
Supplier:
  path: fixtures/fragments_tiny.sdf
QMDriver:
  engine: TeraChem
  template_input_file: fixtures/terachem_template.in
  output_file: fragments.aselmdb
  keep_molden: false
  keep_stdout: false
  clean_tmp: true
  n_processes: 1
  n_gpus: 1
  terachem_args: [terachem]
