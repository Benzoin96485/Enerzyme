# OTF multi-molecule batch smoke for PhysNet (Enerzyme idx_i/idx_j path).
Datahub:
  data_format: pickle
  data_path: fixtures/molecules_otf_tiny.pkl
  preload: false
  neighbor_list: ""
  features:
    N: null
    Q: total_chrg
    Ra: coord
    Za: atom_type
  targets:
    E: energy
    Fa: grad
  transforms:
    negative_gradient: true
Metric:
  E:
    rmse: 1
  Fa:
    rmse: 1
Modelhub:
  internal_FFs:
    FF_OTF_PhysNet:
      active: true
      architecture: PhysNet
      suffix: null
      build_params:
        Bohr_in_R: 0.5291772108
        Hartree_in_E: 1
        cutoff_fn: polynomial
        cutoff_sr: 10.0
        dim_embedding: 32
        max_Za: 94
        num_rbf: 8
      layers:
      - name: RangeSeparation
      - name: ExponentialGaussianRBF
        params:
          no_basis_at_infinity: false
          init_alpha: 1
          exp_weighting: false
          learnable_shape: true
          init_width_flavor: PhysNet
      - name: RandomAtomEmbedding
      - name: Core
        params:
          num_blocks: 1
          num_residual_atomic: 1
          num_residual_interaction: 1
          num_residual_output: 1
          activation_fn: shifted_softplus
          activation_params:
            dim_feature: 1
            initial_alpha: 1
            initial_beta: 1
            learnable: false
          dropout_rate: 0.0
      - name: AtomicAffine
        params:
          scales:
            Ea: {learnable: true, values: 1}
          shifts:
            Ea: {learnable: true, values: 0}
      - name: EnergyReduce
      - name: Force
      loss:
        mse:
          E: 1
          Fa: 1
Trainer:
  Splitter:
    method: random
    parts:
    - training
    - validation
    ratios:
    - 2
    - 1
    preload: false
    save: false
    seed: 114514
  batch_size: 2
  max_epochs: 1
  patience: 1
  num_workers: 1
  cuda: false
  # RBF centers/widths are initialized in float64
  dtype: float64
  learning_rate: 0.001
  resume: 0
  use_ema: false
  otf_graph: true
  seed: 114514
