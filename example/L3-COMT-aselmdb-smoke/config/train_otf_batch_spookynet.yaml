# OTF multi-molecule batch smoke for SpookyNet (Enerzyme idx_i/idx_j path).
Datahub:
  data_format: pickle
  data_path: fixtures/molecules_otf_tiny.pkl
  preload: false
  neighbor_list: ""
  features:
    N: null
    Q: total_chrg
    S: total_spin
    Ra: coord
    Za: atom_type
  targets:
    E: energy
    Fa: grad
  transforms:
    negative_gradient: true
Metric:
  E:
    rmse: 1
  Fa:
    rmse: 1
Modelhub:
  internal_FFs:
    FF_OTF_SpookyNet:
      active: true
      architecture: SpookyNet
      suffix: null
      build_params:
        Bohr_in_R: 0.5291772108
        Hartree_in_E: 1
        activation_fn: swish
        cutoff_sr: 10.0
        dim_embedding: 32
        max_Za: 86
        num_rbf: 8
      layers:
      - name: RangeSeparation
        params:
          cutoff_fn: bump
      - name: ExponentialBernsteinRBF
        params:
          exp_weighting: false
          init_alpha: 0.944863062918464
          learnable_shape: true
          no_basis_at_infinity: false
      - name: NuclearEmbedding
        params:
          use_electron_config: true
          zero_init: false
      - name: ElectronicEmbedding
        params:
          attribute: charge
          num_residual: 1
      - name: ElectronicEmbedding
        params:
          attribute: spin
          num_residual: 1
      - name: Core
        params:
          dropout_rate: 0.0
          num_modules: 1
          num_residual_local: 1
          num_residual_local_d: 1
          num_residual_local_p: 1
          num_residual_local_s: 1
          num_residual_local_x: 1
          num_residual_nonlocal_k: 1
          num_residual_nonlocal_q: 1
          num_residual_nonlocal_v: 1
          num_residual_output: 1
          num_residual_post: 1
          num_residual_pre: 1
          shallow_ensemble_size: 1
          use_irreps: true
      - name: AtomicAffine
        params:
          scales:
            Ea: {learnable: true, values: 1}
          shifts:
            Ea: {learnable: true, values: 0}
      - name: EnergyReduce
      - name: Force
      loss:
        mse:
          E: 1
          Fa: 1
Trainer:
  Splitter:
    method: random
    parts:
    - training
    - validation
    ratios:
    - 2
    - 1
    preload: false
    save: false
    seed: 114514
  batch_size: 2
  max_epochs: 1
  patience: 1
  num_workers: 1
  cuda: false
  # SpookyNet NuclearEmbedding electron_config buffers are float64
  dtype: float64
  learning_rate: 0.001
  resume: 0
  use_ema: false
  otf_graph: true
  seed: 114514
