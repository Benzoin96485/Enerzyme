# Enerzymette-compatible pickle output (pickle_name or .pkl output_file).
Supplier:
  path: fixtures/fragments_tiny.sdf
QMDriver:
  engine: TeraChem
  template_input_file: fixtures/terachem_template.in
  pickle_name: fragments.pkl
  keep_molden: false
  keep_stdout: false
  clean_tmp: true
  n_processes: 1
  n_gpus: 1
  terachem_args: [terachem]
