# Minimal uma_flow_qs train (1 epoch) on tiny molecules with synthetic Qa/Sa.
# Checkpoint path is a placeholder: resolve UMA_CHECKPOINT from the environment
# when launching (do not commit host-absolute paths).
# Requires optional deps: fairchem, torchdiffeq (pip install -e '.[flow]').
Datahub:
  data_format: pickle
  data_path: fixtures/fragments_flow_tiny.pkl
  preload: true
  neighbor_list: ""
  features:
    N: null
    Q: total_chrg
    S: total_spin
    Ra: coord
    Za: atom_type
  targets:
    Qa: chrg
    Sa: spin_dens
  global_transforms:
    uniform_qs_init: true
Metric:
  Qa:
    rmse: 1
  Sa:
    rmse: 1
Modelhub:
  internal_FFs:
    FF_UMA_FLOW:
      active: true
      architecture: uma_flow_qs
      suffix: null
      build_params:
        checkpoint_path: UMA_CHECKPOINT
        frozen_backbone: true
        shallow_ensemble_size: 1
        dim_embedding: 128
      layers:
      - name: ScalarDenseEmbedding
        params:
          embed_field: Q_flow_a
          initial_weight: zero
          initial_bias: zero
          activation_fn: null
      - name: ScalarDenseEmbedding
        params:
          embed_field: S_flow_a
          initial_weight: zero
          initial_bias: zero
          activation_fn: null
      - name: GraphScalarBroadcastEmbedding
        params:
          embed_field: flow_t
      - name: GatherAtomEmbedding
      - name: Core
      - name: VelocityReadout
        params:
          head_type: dense
          output_fields:
          - Q_vel_a
          - S_vel_a
      - name: VelocityConservation
      loss:
        cfm:
          weight_q: 1.0
          weight_s: 1.0
Trainer:
  Generator:
    enabled: true
    ode_predict: true
    ode_method: euler
    ode_options:
      step_size: 0.5
  Splitter:
    method: random
    parts:
    - training
    - validation
    ratios:
    - 2
    - 1
    preload: false
    save: true
    seed: 114514
  batch_size: 2
  num_workers: 1
  max_epochs: 1
  patience: 1
  cuda: true
  dtype: float32
  learning_rate: 0.001
  resume: 0
  use_ema: false
  seed: 114514
