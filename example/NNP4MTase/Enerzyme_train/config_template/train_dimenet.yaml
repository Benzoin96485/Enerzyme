Datahub:
  data_path: "__DATA_PATH__"
  data_format: pickle
  features:
    Ra: coord
    Za: atom_type
    Q:
    N:
  targets:
    E: energy
    Fa: grad
    Qa: chrg
    Q:
    M2: dipole
  preload: true
  neighbor_list: full
  transforms:
    atomic_energy: "__ATOMIC_ENERGY_PATH__"
    negative_gradient: true
Metric:
  E:
    rmse: 1
  Fa:
    rmse: 529.17721
  M2:
    rmse: 1.8897261
  Qa:
    rmse: __QA_WEIGHT__
  Q:
    rmse: 1
Modelhub:
  internal_FFs:
    FF01:
      active: true
      architecture: dimenet
      build_params:
        Bohr_in_R: 0.5291772108
        Hartree_in_E: 1
        cutoff_fn: polynomial
        cutoff_sr: 5.0
        dim_embedding: 128
        max_Za: 16
        num_rbf: 6
      layers:
      - name: RangeSeparation
      - name: BesselRBF
        params:
          envelope_exponent: 5
          flavor: dimenet
          trainable: true
      - name: RandomAtomEmbedding
      - name: Core
        params:
          activation_fn: swish
          activation_params:
            dim_feature: 1
            initial_alpha: 1
            initial_beta: 1
            learnable: false
          envelope_exponent: 5
          num_after_skip: 2
          num_before_skip: 1
          num_bilinear: 8
          num_blocks: 6
          num_spherical: 7
      - name: HierachicalReadout
        params:
          activation_fn: swish
          activation_params:
            dim_feature: 1
            initial_alpha: 1
            initial_beta: 1
            learnable: false
          head_type: mlp
          initial_weight: semi_orthogonal_glorot
          keep_feature: false
          num_hidden_layers: 3
          output_fields: [Ea, Qa]
          use_bias_out: false
      - name: AtomicAffine
        params:
          scales:
            Ea:
              learnable: true
              values: 1
            Qa:
              learnable: true
              values: 1
          shifts:
            Ea:
              learnable: true
              values: 0
            Qa:
              learnable: true
              values: 0
      - name: ChargeConservation
      - name: AtomicCharge2Dipole
      - name: ElectrostaticEnergy
        params:
          cutoff_lr: null
          dielectric_constant: __DIELECTRIC_CONSTANT__
          flavor: PhysNet
      - name: EnergyReduce
      - name: Force
      loss:
        mae:
          E: 1
          Fa: 529.17721
          M2: 1.8897261
          Q: 1
          Qa: __QA_WEIGHT__
      suffix: null
Trainer:
  Splitter:
    method: random
    parts:
    - training
    - validation
    - test
    preload: true
    ratios:
    - 875
    - 125
    - 250
    save: true
    seed: 114514
  learning_rate: 0.001
  batch_size: 8
  cuda: true
  dtype: float32
  max_epochs: 10000
  max_norm: -1
  patience: 200
  seed: 114514
  warmup_ratio: 0.001
  use_ema: true
  ema_decay: 0.999
  num_workers: 10
  resume: 0
